name: EduSphere Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma Client from project schema
        run: npm run prisma:generate --workspace=services/api

      - name: Typecheck Backend API
        run: cd services/api && npx tsc --noEmit

      - name: Build Next.js Web
        run: npm run build --workspace=apps/web

  backend-tests:
    name: Node.js & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build --workspace=packages/shared

      - name: Run Jest API & Security Test Suite
        run: cd services/api && npx jest --runInBand --detectOpenHandles

  python-tests:
    name: Python Microservice Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/analytics/requirements.txt

      - name: Run pytest Analytics & Grading Tests
        run: |
          cd services/analytics
          python -c "from app.main import app; print(app.title)"
          python -m pytest tests/ -v

  dependency-security:
    name: Production Dependency Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate

  production-images:
    name: Docker Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  postgres-integration:
    name: PostgreSQL Persistence & Concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edusphere
          POSTGRES_PASSWORD: integration_test_only
          POSTGRES_DB: edusphere_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edusphere -d edusphere_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://edusphere:integration_test_only@localhost:5432/edusphere_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/shared
      - run: npx jest --runInBand --testMatch '**/persistence.integration.ts'
        working-directory: services/api
